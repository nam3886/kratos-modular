server:
  http:
    addr: 0.0.0.0:8000
    timeout: 5s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 5s
data:
  databases:
    main:
      driver: pgx
      source: postgres://app:app@127.0.0.1:5432/app?sslmode=disable
      max_open_conns: 20
  rabbitmq:
    url: amqp://guest:guest@127.0.0.1:5672/

trace:
  endpoint: ""
